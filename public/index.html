
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c4cf1">
  <title>StudyMate AI</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand-icon">🎓</span>
      <span>StudyMate <span class="brand-ai">AI</span></span>
    </a>
    <span class="language-tag">हिंदी • English • Hinglish</span>
  </header>

  <main class="container">
    <section class="welcome">
      <div class="welcome-label">YOUR PERSONAL STUDY ASSISTANT</div>
      <h1>Padhai ab hogi <span>Easy!</span></h1>
    </section>

    <section class="workspace">
      <div class="section-heading">
        <h2>Ask StudyMate AI</h2>
        <button id="clearChat" class="secondary-button" type="button">
          Clear Chat
        </button>
      </div>

      <div id="chatBox" class="chat-box" aria-live="polite">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">💡</div>
          <h3>Kaise help kar sakta hoon?</h3>
          <p>Example: What is Python?</p>
          <button class="suggestion" type="button"
            data-question="What is Python?">
            What is Python?
          </button>
          <button class="suggestion" type="button"
            data-question="भारत के संविधान को किसने बनाया?">
            भारत के संविधान को किसने बनाया?
          </button>
        </div>
      </div>

      <form id="chatForm" class="composer">
        <textarea id="userInput"
          placeholder="Message StudyMate AI..."
          rows="2"
          aria-label="Your question"></textarea>

        <div id="imagePreview" class="image-preview" hidden>
          <img id="previewImage" alt="Selected question">
          <button id="removeImage" type="button" class="remove-image">
            Remove photo ✕
          </button>
        </div>

        <div class="composer-actions">
          <div class="tools">
            <label class="upload-button icon-button"
              for="imageInput" title="Add photo" aria-label="Add photo">
              <svg viewBox="0 0 24 24" width="23" height="23"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="3"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="m21 15-5-5L5 21"/>
              </svg>
            </label>

            <input id="imageInput" type="file"
              accept="image/*" capture="environment" hidden>

            <select id="voiceLanguage" class="voice-language"
              aria-label="Voice input language" title="Voice language">
              <option value="en-IN">English</option>
              <option value="hi-IN">हिंदी</option>
            </select>

            <button id="voiceButton" type="button"
              class="icon-button mic-icon-button"
              aria-label="Speak your question" title="Speak your question">
              <svg viewBox="0 0 24 24" width="23" height="23"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
                <path d="M12 19v3"/>
                <path d="M8 22h8"/>
              </svg>
            </button>
          </div>

          <button id="sendButton" type="submit" class="send-button"
            aria-label="Send message" title="Send message">
            <svg viewBox="0 0 24 24" width="22" height="22"
              fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M12 19V5"/>
              <path d="m5 12 7-7 7 7"/>
            </svg>
          </button>
        </div>

        <p id="voiceStatus" class="status-text" aria-live="polite"></p>
      </form>
    </section>

    <section class="notes-section">
      <h2>📝 Quick Notes Summary</h2>
      <p>Apne notes paste karo aur important sentences nikalo.</p>
      <textarea id="notes" rows="5"
        placeholder="Yahan apne notes paste karo..."></textarea>
      <button id="summarizeButton" class="send-button" type="button">
        Summarize Notes
      </button>
      <div id="summary" class="summary" aria-live="polite"></div>
    </section>

    <footer>StudyMate AI • Learn smarter, every day.</footer>
  </main>
</body>
</html>
